name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Restore Cloudflare credentials
        shell: bash
        env:
          WRANGLER_CONFIG_B64: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_B64 }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: |
          mkdir -p "$XDG_CONFIG_HOME/.wrangler/config"
          printf '%s' "$WRANGLER_CONFIG_B64" | base64 --decode > "$XDG_CONFIG_HOME/.wrangler/config/default.toml"
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/wrangler-config
        run: pnpm exec wrangler deploy
